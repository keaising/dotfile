# tmux-like keybindings for ghostty
# usage: ghostty --config-file=~/.config/ghostty/tmux-keybinds.conf
# prefix key: ctrl+a (same as tmux)

# tab (tmux window)
keybind = ctrl+a>n=next_tab
keybind = ctrl+a>p=previous_tab
keybind = ctrl+a>c=new_tab
keybind = ctrl+a>v=new_tab
keybind = ctrl+a>x=close_surface
keybind = ctrl+a>r=prompt_tab_title

# split (tmux pane)
keybind = ctrl+a>|=new_split:right
keybind = ctrl+a>\=new_split:right
keybind = ctrl+a>-=new_split:down

# zoom split (tmux resize-pane -Z)
keybind = ctrl+a>z=toggle_split_zoom

# focus split
keybind = ctrl+a>h=goto_split:left
keybind = ctrl+a>j=goto_split:down
keybind = ctrl+a>k=goto_split:up
keybind = ctrl+a>l=goto_split:right

# resize split (10px per press; tmux has no pixel-based repeat)
keybind = ctrl+a>ctrl+h=resize_split:left,10
keybind = ctrl+a>ctrl+j=resize_split:down,10
keybind = ctrl+a>ctrl+k=resize_split:up,10
keybind = ctrl+a>ctrl+l=resize_split:right,10

# move tab (tmux swap-window)
keybind = ctrl+a>,=move_tab:-1
keybind = ctrl+a>.=move_tab:1

# reload config (tmux R)
keybind = ctrl+a>shift+r=reload_config
